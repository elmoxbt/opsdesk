<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        text-align: center;
        color: #18181b;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #fafafa;
          background: #121214;
        }
      }
      button {
        margin-top: 16px;
        padding: 10px 18px;
        border-radius: 10px;
        border: 1px solid #d4d4d8;
        background: transparent;
        color: inherit;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 style="font-size: 20px">You're offline</h1>
      <p>
        This page hasn't been opened on this device yet, so it isn't available offline.<br />Open the app's
        home screen once you have signal.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
