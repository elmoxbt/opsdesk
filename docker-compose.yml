# Local infrastructure only. Apps run on the host with `pnpm dev` for fast reloads.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opsdesk
      POSTGRES_PASSWORD: opsdesk
      POSTGRES_DB: opsdesk
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opsdesk
      MINIO_ROOT_PASSWORD: opsdesk-secret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job that creates the bucket, then exits.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 opsdesk opsdesk-secret &&
      mc mb --ignore-existing local/opsdesk &&
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
